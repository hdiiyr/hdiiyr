<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
  .navy { background: #141c4f; }
  .ivory { background: #f3efe6; }
  .gold-line { position: absolute; border: 2px solid rgba(176, 138, 62, 0.35); border-bottom: 0; border-radius: 999px 999px 0 0; }
  /* Crops of the single 589×2047 page: the image is moved inside a fixed frame. */
  .shot.slice > img { position: absolute; left: 0; width: 100%; height: auto; }
</style>
</head>
<body>

<!-- Gallery cover: the page in two columns -->
<section class="board navy" id="cover" data-size="cover">
  <div class="gold-line" style="left: 60px; top: 300px; width: 380px; height: 760px;"></div>
  <div class="gold-line" style="left: 1170px; top: 120px; width: 380px; height: 940px;"></div>
  <div class="shot slice" style="left: 181px; top: 80px; width: 589px; height: 840px;"><img src="../source/jewelry/home.jpg" alt="" style="top: 0;"></div>
  <div class="shot slice" style="left: 830px; top: 80px; width: 589px; height: 840px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -840px;"></div>
</section>

<!-- Arched portrait, cropped to 4:5 (x 40–288, y 630–940 at 2.823×) -->
<section class="board navy" id="detail" data-size="detail">
  <div class="shot slice" style="left: 90px; top: 112px; width: 700px; height: 875px; border-radius: 18px;">
    <img src="../source/jewelry/home.jpg" alt="" style="top: -1778px; left: -113px; width: 1663px;">
  </div>
</section>

<!-- The whole page in three columns -->
<section class="board ivory" id="discovery" data-size="wide">
  <div class="shot slice" style="left: 80px; top: 159px; width: 589px; height: 682px;"><img src="../source/jewelry/home.jpg" alt="" style="top: 0;"></div>
  <div class="shot slice" style="left: 705px; top: 159px; width: 589px; height: 682px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -682px;"></div>
  <div class="shot slice" style="left: 1330px; top: 159px; width: 589px; height: 682px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -1365px;"></div>
</section>

<!-- Editorial sections at 1.1×: collection, gift, vitrine, testimonial -->
<section class="board ivory" id="editorial" data-size="cover">
  <div class="shot slice" style="left: 120px; top: 130px; width: 648px; height: 321px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -693px;"></div>
  <div class="shot slice" style="left: 120px; top: 491px; width: 648px; height: 265px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -1751px;"></div>
  <div class="shot slice" style="left: 832px; top: 170px; width: 648px; height: 293px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -1397px;"></div>
  <div class="shot slice" style="left: 832px; top: 503px; width: 648px; height: 366px;"><img src="../source/jewelry/home.jpg" alt="" style="top: -1020px;"></div>
</section>

<script src="board.js"></script>
</body>
</html>

<!doctype html>
<!-- Social share image. Render: node scripts/render-og.mjs → public/og.png (1200×630). -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Vazirmatn"; src: url("../src/fonts/vazirmatn-arabic.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Gloock"; src: url("../src/fonts/gloock-latin.woff2") format("woff2"); }
  @font-face { font-family: "Manrope"; src: url("../src/fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #22384a;
    color: #d9e6e3;
    font-family: "Vazirmatn", "Manrope", sans-serif;
  }
  .stripe { position: absolute; inset: 0 auto 0 0; width: 14px; background: #d9e6e3; }
  .arch {
    position: absolute; left: 96px; top: 150px; width: 300px; height: 400px;
    border: 26px solid #f2785c; border-bottom: 0; border-radius: 150px 150px 0 0;
  }
  .dot { position: absolute; left: 228px; top: 470px; width: 36px; height: 36px; border-radius: 50%; background: #d9e6e3; }
  .text { position: absolute; right: 96px; top: 140px; width: 620px; }
  .label { font: 700 18px/1 "Manrope", sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .75; direction: ltr; text-align: right; }
  h1 { margin-top: 34px; font-weight: 900; font-size: 92px; line-height: 1.2; color: #f4f8f7; }
  .en { margin-top: 18px; font: 400 54px/1.1 "Gloock", serif; direction: ltr; text-align: right; }
  .line { margin-top: 44px; font-size: 26px; line-height: 1.7; opacity: .85; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="arch"></div>
  <div class="dot"></div>
  <div class="text">
    <p class="label">Portfolio · Résumé</p>
    <h1>هادی ایمانی</h1>
    <p class="en">Hadi Imani</p>
    <p class="line">پروژه‌های منتخب، کیس‌استادی‌ها و رزومه</p>
  </div>
</body>
</html>

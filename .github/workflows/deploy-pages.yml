# Builds the static export and publishes it to GitHub Pages
# (https://<owner>.github.io/<repo>/) on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the Pages address
        run: |
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          name="${{ github.event.repository.name }}"
          if [ "$name" = "$owner.github.io" ]; then base=""; else base="/$name"; fi
          echo "PAGES_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://$owner.github.io$base" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
